name: cast
on:
  pull_request:
    paths: ["cast/**", "scripts/**", "docs/**", "lib/**", "package.json", "package-lock.json"]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Faraday masthead drift check (FDY-447; vendored lib/faraday-masthead must match its MANIFEST)
        run: node lib/faraday-masthead/check-drift.mjs
      - name: ffmpeg for the walt-tf mixdown tests (TH-38)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:cast
      - run: npm run resolve:network:snapshot
      - run: npm run audit:cast -- --stdout
  smoke-gdelt:
    # Live call to GDELT. Non-blocking: GDELT answers shared GitHub runner IPs with HTTP 429 at times.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run smoke:gdelt
