name: cast
on:
  pull_request:
    paths: ["cast/**", "scripts/**", "docs/**", "package.json", "package-lock.json"]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:cast
      - run: npm run resolve:network:snapshot
  smoke-gdelt:
    # Live call to GDELT. Non-blocking: GDELT rate-limits shared runner IPs at times.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Reach GDELT (diagnostic)
        run: curl -sS -m 40 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "https://api.gdeltproject.org/api/v2/doc/doc?query=%22data%20center%20moratorium%22&mode=timelinevol&format=json&timespan=90d" || true
      - run: npm run smoke:gdelt
